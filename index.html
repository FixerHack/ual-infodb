<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>УАЛ | Головна</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20261124">
</head>
<body>
<main>
  <div class="wrap">
    <section class="home-hero">
      <span class="eyebrow">Українська Академія Лідерства · Львів</span>
      <h1>Усе про життя <span style="color:var(--violet)">осередку</span></h1>
      <p class="lead">Навчальний рік, книжки, самоврядування й дні народження — в одному місці. Обери розділ нижче.</p>
      <div class="now-card" id="now-card" hidden></div>
    </section>

    <section>
      <div class="cats" id="cats"></div>
    </section>
  </div>
</main>
<script>
  // Підказка «зараз триває» за поточним місяцем
  (function () {
    const m = new Date().getMonth(); // 0 = січень
    const map = {
      8: [1, "Становлення", "m1"], 9: [1, "Становлення", "m1"],
      10: [2, "Воїн", "m2"], 11: [2, "Воїн", "m2"],
      0: [3, "Дослідник", "m3"], 1: [3, "Дослідник", "m3"], 2: [3, "Дослідник", "m3"],
      3: [4, "Мандрівник", "m4"], 4: [4, "Мандрівник", "m4"], 5: [4, "Мандрівник", "m4"],
    };
    const cur = map[m];
    const el = document.getElementById("now-card");
    if (!cur) return;
    el.className = "now-card " + cur[2];
    el.innerHTML = `<span>Зараз триває</span><b>Модуль ${cur[0]} · ${cur[1]}</b><a href="timeline.html#module-${cur[0]}">Події модуля →</a>`;
    el.hidden = false;
  })();
</script>
<script src="assets/site.js?v=20261124"></script>
<script>
  // Плитки розділів беруться з того ж списку, що й меню (assets/site.js)
  document.getElementById("cats").innerHTML = UAL_SECTIONS.filter((s) => !s.home).map((s) => {
    const pages = s.pages.filter((p) => !p.hidden);
    const feature = s.title === "Бібліотека";
    const text = `<h3><a href="${pages[0].href}">${s.title}</a></h3><p>${s.desc}</p>`;
    return `<div class="cat${feature ? " cat-feature" : ""}" style="--acc:${s.accent}">
      <span class="cat-ico">${s.icon}</span>
      ${feature ? `<div class="cat-text">${text}<div class="cat-sub"><a href="biblioteka.html">Відкрити каталог →</a></div></div>` : text}
      ${!feature && pages.length > 1 ? `<div class="cat-sub">${pages.map((p) => `<a href="${p.href}">${p.title}</a>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
</script>
</body>
</html>
